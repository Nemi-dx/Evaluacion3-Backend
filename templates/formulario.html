{% extends 'base.html' %}

{% block title %} Formulario {% endblock %}

{% block contenido %}

<h1 class="h3 mb-4 text-gray-800">{{titulo}}</h1>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary mt-3"><i class="fas fa-save"></i> Guardar</button>
                    <a href="javascript:history.back()" class="btn btn-secondary mt-3">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
